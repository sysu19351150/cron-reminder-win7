<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>定时提醒配置</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 16px 56px;
      font-family: "微软雅黑", "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #333;
      background: #f0f2f5;
    }

    .wrap { max-width: 860px; margin: 0 auto; }

    /* ---------- 页头 ---------- */
    .page-head { margin-bottom: 22px; }

    .page-title {
      margin: 0;
      padding-left: 12px;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.3;
      color: #1f2d3d;
      border-left: 4px solid #2d8cf0;
    }

    .page-head-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .page-desc {
      margin: 6px 0 0 16px;
      font-size: 13px;
      color: #8a94a6;
    }

    .head-link {
      flex: none;
      padding: 5px 14px;
      font-size: 13px;
      color: #2d8cf0;
      text-decoration: none;
      background: #fff;
      border: 1px solid #bfdcfb;
      border-radius: 4px;
      transition: background-color .15s, border-color .15s;
    }

    .head-link:hover { background: #eaf4fe; border-color: #2d8cf0; }

    @media (max-width: 640px) {
      .page-head-bar { flex-direction: column; align-items: flex-start; gap: 10px; }
    }

    /* ---------- 卡片 ---------- */
    .card {
      padding: 20px 24px;
      margin-bottom: 20px;
      background: #fff;
      border: 1px solid #e3e8ee;
      border-radius: 6px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
    }

    .card-title {
      display: flex;
      align-items: center;
      margin: 0 0 18px;
      font-size: 15px;
      font-weight: 600;
      color: #1f2d3d;
      transition: color .15s;
    }

    .card-title.is-edit { color: #2d8cf0; }

    .card-title .tag {
      display: none;
      margin-left: 8px;
      padding: 0 8px;
      font-size: 12px;
      font-weight: normal;
      line-height: 18px;
      color: #2d8cf0;
      background: #eaf4fe;
      border: 1px solid #bfdcfb;
      border-radius: 10px;
    }

    .card-title.is-edit .tag { display: inline-block; }

    .collapse-btn {
      margin-left: auto;
      padding: 2px 8px;
      font-family: inherit;
      font-size: 12px;
      line-height: 18px;
      color: #97a3b4;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      transition: color .15s, border-color .15s, background-color .15s;
    }

    .collapse-btn:hover {
      color: #2d8cf0;
      background: #f2f8fe;
      border-color: #d6e6fb;
    }

    .caret {
      display: inline-block;
      width: 0;
      height: 0;
      margin-left: 5px;
      vertical-align: middle;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid currentColor;
      transition: transform .2s;
    }

    .card.collapsed .caret { transform: rotate(-90deg); }

    .card.collapsed .card-title { margin-bottom: 0; }

    .card.collapsed .card-body { display: none; }

    .collapsed-view { display: none; }

    .card.collapsed .collapsed-view {
      display: block;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed #e3e8ee;
    }

    .summary-label {
      margin-right: 4px;
      font-size: 12px;
      color: #97a3b4;
    }

    .summary-chip {
      display: inline-block;
      max-width: 180px;
      margin: 3px 6px 3px 0;
      padding: 0 9px;
      font-size: 12px;
      line-height: 20px;
      color: #48576a;
      background: #f4f5f7;
      border: 1px solid #e3e5e8;
      border-radius: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }

    .summary-chip b {
      margin-right: 5px;
      font-weight: 600;
      color: #2d8cf0;
    }

    .summary-more {
      font-size: 12px;
      color: #97a3b4;
    }

    .summary-empty {
      padding: 4px 0;
      font-size: 13px;
      color: #a4adba;
    }

    /* ---------- 表单 ---------- */
    .form-group {
      display: flex;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .form-group > label {
      flex: 0 0 96px;
      padding: 7px 12px 0 0;
      text-align: right;
      color: #48576a;
    }

    .form-group .field { flex: 1; min-width: 0; }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 7px 10px;
      font-family: inherit;
      font-size: 14px;
      color: #333;
      background: #fff;
      border: 1px solid #d6dce4;
      border-radius: 4px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input[type="text"]::placeholder,
    textarea::placeholder { color: #b7c0cd; }

    input[type="text"]:focus,
    textarea:focus {
      border-color: #2d8cf0;
      box-shadow: 0 0 0 2px rgba(45, 140, 240, .15);
    }

    textarea {
      min-height: 78px;
      resize: vertical;
    }

    .check-line {
      display: flex;
      align-items: center;
      padding-top: 6px;
      color: #48576a;
    }

    .field-hint {
      margin-top: 5px;
      font-size: 12px;
      line-height: 1.45;
      color: #97a3b4;
      word-break: break-all;
    }

    .check-line input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0 8px 0 0;
      cursor: pointer;
    }

    /* ---------- 按钮 ---------- */
    .btn {
      display: inline-block;
      padding: 7px 18px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color .15s, border-color .15s, color .15s;
    }

    .btn-primary {
      color: #fff;
      background: #2d8cf0;
      border-color: #2d8cf0;
    }
    .btn-primary:hover { background: #2b85e4; border-color: #2b85e4; }
    .btn-primary:active { background: #2573c8; }

    .btn-default {
      color: #48576a;
      background: #fff;
      border-color: #d6dce4;
    }
    .btn-default:hover { color: #2d8cf0; border-color: #2d8cf0; }

    .btn-danger {
      color: #ed4014;
      background: #fff;
      border-color: #f5c6b8;
    }
    .btn-danger:hover { background: #fff4f0; border-color: #ed4014; }

    .btn-sm { padding: 5px 14px; font-size: 13px; }

    .form-actions {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px dashed #e3e8ee;
    }
    .form-actions .btn { margin-right: 10px; }

    /* ---------- 列表 ---------- */
    .reminder-item {
      padding: 14px 16px;
      margin-bottom: 12px;
      background: #fbfcfd;
      border: 1px solid #e3e8ee;
      border-radius: 6px;
      transition: border-color .15s, box-shadow .15s, background-color .15s;
    }

    .reminder-item:hover {
      background: #fff;
      border-color: #c5d6ea;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .07);
    }

    .reminder-item:last-child { margin-bottom: 0; }

    .item-head {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .item-name {
      font-size: 15px;
      font-weight: 600;
      color: #1f2d3d;
      word-break: break-all;
    }

    .badge {
      flex: 0 0 auto;
      margin-left: 10px;
      padding: 0 8px;
      font-size: 12px;
      line-height: 18px;
      border-radius: 10px;
    }
    .badge-on {
      color: #19be6b;
      background: #e8faf0;
      border: 1px solid #b7f0cd;
    }
    .badge-off {
      color: #808695;
      background: #f4f5f7;
      border: 1px solid #e3e5e8;
    }

    .item-row {
      display: flex;
      margin-bottom: 4px;
      font-size: 13px;
      color: #5c6b7f;
    }

    .item-row .k {
      flex: 0 0 48px;
      color: #97a3b4;
    }

    .item-row .v {
      flex: 1;
      min-width: 0;
      word-break: break-all;
    }

    /* ---------- 跳转地址 ---------- */
    .jump-link {
      color: #2d8cf0;
      text-decoration: none;
      border-bottom: 1px dashed rgba(45, 140, 240, .5);
      word-break: break-all;
    }

    .jump-link:hover { color: #2b85e4; border-bottom-style: solid; }

    .jump-local {
      font-family: Consolas, "Courier New", monospace;
      color: #5c6b7f;
      word-break: break-all;
    }

    .mono {
      font-family: Consolas, "Courier New", monospace;
      color: #2d8cf0;
    }

    .item-actions {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #eaedf1;
    }

    .item-actions .btn { margin-right: 8px; }

    .empty {
      padding: 32px 0;
      text-align: center;
      font-size: 13px;
      color: #a4adba;
      background: #fbfcfd;
      border: 1px dashed #dfe4ea;
      border-radius: 6px;
    }

    .cron-editor-warning {
      display: none;
      margin-top: 10px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.6;
      color: #b25c00;
      background: #fff8e6;
      border: 1px solid #ffe0a3;
      border-radius: 4px;
    }

    /* ---------- Cron 触发时间预览 ---------- */
    .cron-preview {
      margin-top: 12px;
      padding: 12px 14px;
      background: #f7f9fb;
      border: 1px solid #e3e8ee;
      border-radius: 6px;
    }

    .cron-preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .cron-preview-title {
      font-size: 13px;
      font-weight: 600;
      color: #48576a;
    }

    .cron-preview-sub {
      font-size: 12px;
      color: #97a3b4;
    }

    .cron-preview-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cron-preview-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      font-size: 13px;
      color: #48576a;
      background: #fff;
      border: 1px solid #e3e8ee;
      border-radius: 4px;
    }

    .cron-preview-index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      font-size: 11px;
      color: #2d8cf0;
      background: #eaf4fe;
      border-radius: 50%;
    }

    .cron-preview-when b {
      color: #1f2d3d;
      font-weight: 600;
    }

    .cron-preview-date {
      font-size: 12px;
      color: #97a3b4;
    }

    .cron-preview-tip {
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.6;
      color: #97a3b4;
    }

    .cron-preview-tip:empty { display: none; }

    .cron-preview-tip.err { color: #c9370b; }

    .cron-preview-tip.warn { color: #ff9900; }

    /* ---------- 窄屏适配 ---------- */
    @media (max-width: 640px) {
      body { padding: 18px 12px 40px; }
      .card { padding: 16px; }
      .form-group { display: block; }
      .form-group > label {
        display: block;
        flex: none;
        width: auto;
        padding: 0 0 6px;
        text-align: left;
      }
      .item-head { flex-wrap: wrap; }
    }
  </style>
  <!-- 引入自定义中文图形化 Cron 编辑器 -->
  <link rel="stylesheet" href="/cron-editor.css">
  <script src="/cron-editor.js"></script>
</head>
<body>
  <div class="wrap">

    <div class="page-head">
      <h1 class="page-title">定时提醒配置</h1>
      <div class="page-head-bar">
        <p class="page-desc">配置 Cron 表达式，到点自动推送提醒内容</p>
        <a class="head-link" href="/config">全局设置 →</a>
      </div>
    </div>

    <!-- 表单 -->
    <div class="card collapsed" id="formCard">
      <h3 class="card-title" id="formTitle">
        新增提醒
        <span class="tag">编辑中</span>
        <button type="button" class="collapse-btn" data-card="formCard" aria-expanded="false">展开<span class="caret"></span></button>
      </h3>
      <div class="card-body">

        <div class="form-group">
          <label for="name">提醒名称</label>
          <div class="field">
            <input id="name" type="text" placeholder="比如：喝水提醒">
          </div>
        </div>

        <div class="form-group">
          <label for="cronExpr">Cron 表达式</label>
          <div class="field">
            <input id="cronExpr" type="text" placeholder="比如：0 */30 * * * * （每 30 分钟触发一次）">
            <!-- 图形化 Cron 编辑器容器 -->
            <div id="cronSelector"></div>
            <div class="cron-editor-warning" id="cronEditorWarning">
              该表达式包含图形编辑器不支持的高级写法，已保留原文，请直接修改上方文本框。
            </div>

            <!-- 接下来 5 次触发时间预览 -->
            <div class="cron-preview" id="cronPreview" aria-live="polite">
              <div class="cron-preview-head">
                <span class="cron-preview-title">接下来 5 次触发时间</span>
                <span class="cron-preview-sub">随配置实时计算</span>
              </div>
              <div class="cron-preview-list" id="cronPreviewList"></div>
              <div class="cron-preview-tip" id="cronPreviewTip"></div>
            </div>

          </div>
        </div>

        <div class="form-group">
          <label for="content">提示内容</label>
          <div class="field">
            <textarea id="content" placeholder="该站起来喝杯水啦"></textarea>
          </div>
        </div>

        <div class="form-group">
          <label for="jumpUrl">点击跳转</label>
          <div class="field">
            <input id="jumpUrl" type="text" placeholder="https://example.com 或 D:\资料\月报.xlsx">
            <div class="field-hint">可选：到点弹出通知后，点击气泡会用默认浏览器打开网址，或用默认程序打开本地文件 / 文件夹；留空则只关闭通知。</div>
          </div>
        </div>

        <div class="form-group">
          <label>状态</label>
          <div class="field">
            <div class="check-line">
              <input id="enabled" type="checkbox" checked>
              <label for="enabled">启用该提醒</label>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" onclick="saveReminder()">保存提醒</button>
          <button class="btn btn-default" id="cancelEditBtn" style="display:none" onclick="cancelEdit()">取消编辑</button>
        </div>
      </div>
    </div>

    <!-- 列表 -->
    <div class="card" id="listCard">
      <h3 class="card-title">
        已配置提醒列表
        <button type="button" class="collapse-btn" data-card="listCard" aria-expanded="true">收起<span class="caret"></span></button>
      </h3>
      <div class="card-body">
        <div id="list"></div>
      </div>
      <div class="collapsed-view" id="listSummary"></div>
    </div>

  </div>

  <script>
    let currentEditId = null; // 标记当前是否处于编辑模式
    let cronEditor = null; // 图形化编辑器实例

    /* ---------- Cron 未来触发时间预览 ---------- */

    /* CRON_PREVIEW_START */
    var CronPreview = (function () {
      const FIELD_DEFS = [
        { key: 'second', label: '秒', min: 0, max: 59 },
        { key: 'minute', label: '分', min: 0, max: 59 },
        { key: 'hour', label: '时', min: 0, max: 23 },
        { key: 'dayOfMonth', label: '日', min: 1, max: 31 },
        { key: 'month', label: '月', min: 1, max: 12 },
        { key: 'dayOfWeek', label: '周', min: 0, max: 7, starMax: 6 }
      ];

      const MONTH_NAMES = {
        january: 1, jan: 1, february: 2, feb: 2, march: 3, mar: 3, april: 4, apr: 4,
        may: 5, june: 6, jun: 6, july: 7, jul: 7, august: 8, aug: 8,
        september: 9, sep: 9, october: 10, oct: 10, november: 11, nov: 11, december: 12, dec: 12
      };

      const DOW_NAMES = {
        sunday: 0, sun: 0, monday: 1, mon: 1, tuesday: 2, tue: 2,
        wednesday: 3, wed: 3, thursday: 4, thu: 4, friday: 5, fri: 5, saturday: 6, sat: 6
      };

      function replaceNames(text, map) {
        Object.keys(map).sort(function (a, b) { return b.length - a.length; }).forEach(function (name) {
          text = text.replace(new RegExp('\\b' + name + '\\b', 'gi'), String(map[name]));
        });
        return text;
      }

      function expandRange(match, startText, endText) {
        let start = parseInt(startText, 10);
        let end = parseInt(endText, 10);
        if (start > end) { const tmp = start; start = end; end = tmp; }
        const values = [];
        for (let v = start; v <= end; v++) values.push(v);
        return values.join(',');
      }

      function parseField(raw, def) {
        if (raw == null || String(raw).trim() === '') throw new Error(def.label + '字段为空');
        let text = String(raw).trim().toLowerCase();

        if (def.key === 'month') text = replaceNames(text, MONTH_NAMES);
        if (def.key === 'dayOfWeek') {
          text = replaceNames(text, DOW_NAMES);
          // 与 node-cron 保持一致：周日的 7 先归一成 0，再展开区间
          text = text.replace(/\b7\b/g, '0');
        }

        const starMax = def.starMax == null ? def.max : def.starMax;
        text = text.replace(/\*/g, def.min + '-' + starMax);
        text = text.replace(/(\d+)-(\d+)/g, expandRange);

        const stepMatch = /^(.+)\/(\d+)$/.exec(text);
        if (stepMatch) {
          const step = parseInt(stepMatch[2], 10);
          if (step < 1) throw new Error(def.label + '字段的步长必须大于 0');
          // node-cron 的步长语义：保留能被步长整除的值（与实际调度一致）
          const kept = stepMatch[1].split(',').map(function (item) {
            return parseInt(item, 10);
          }).filter(function (value) {
            return !isNaN(value) && value % step === 0;
          });
          if (!kept.length) throw new Error(def.label + '字段的步长没有匹配到任何值');
          text = kept.join(',');
        }

        const values = [];
        text.split(',').forEach(function (part) {
          const item = part.trim();
          if (!/^\d+$/.test(item)) throw new Error(def.label + '字段包含无法识别的内容：' + part);
          let value = parseInt(item, 10);
          if (value < def.min || value > def.max) {
            throw new Error(def.label + '字段取值超出范围（' + def.min + '-' + def.max + '）：' + value);
          }
          if (def.key === 'dayOfWeek' && value === 7) value = 0;
          if (values.indexOf(value) === -1) values.push(value);
        });

        if (!values.length) throw new Error(def.label + '字段没有有效取值');
        values.sort(function (a, b) { return a - b; });
        return values;
      }

      function parse(expression) {
        const normalized = String(expression == null ? '' : expression).trim().replace(/\s+/g, ' ');
        if (!normalized) throw new Error('表达式为空');
        const parts = normalized.split(' ');
        if (parts.length === 5) parts.unshift('0');
        if (parts.length !== 6) throw new Error('需要 5 段或 6 段表达式，当前为 ' + parts.length + ' 段');
        return {
          second: parseField(parts[0], FIELD_DEFS[0]),
          minute: parseField(parts[1], FIELD_DEFS[1]),
          hour: parseField(parts[2], FIELD_DEFS[2]),
          dayOfMonth: parseField(parts[3], FIELD_DEFS[3]),
          month: parseField(parts[4], FIELD_DEFS[4]),
          dayOfWeek: parseField(parts[5], FIELD_DEFS[5])
        };
      }

      function next(expression, count, baseDate) {
        const cron = parse(expression);
        const limit = Math.max(1, Math.round(count || 5));
        const now = baseDate && typeof baseDate.getTime === 'function' ? new Date(baseDate.getTime()) : new Date();
        const result = [];
        const cursor = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const maxDays = 366 * 50; // 最多向后找 50 年，覆盖 2 月 29 日等稀有组合

        for (let dayIndex = 0; dayIndex < maxDays && result.length < limit; dayIndex++) {
          const month = cursor.getMonth() + 1;
          const day = cursor.getDate();
          const weekDay = cursor.getDay();

          if (cron.month.indexOf(month) !== -1 &&
              cron.dayOfMonth.indexOf(day) !== -1 &&
              cron.dayOfWeek.indexOf(weekDay) !== -1) {
            const year = cursor.getFullYear();
            for (let hi = 0; hi < cron.hour.length; hi++) {
              for (let mi = 0; mi < cron.minute.length; mi++) {
                for (let si = 0; si < cron.second.length; si++) {
                  const hh = cron.hour[hi];
                  const mm = cron.minute[mi];
                  const ss = cron.second[si];
                  const time = new Date(year, month - 1, day, hh, mm, ss, 0);
                  // 夏令时切换等情况下时间可能被归一化，跳过无效组合
                  if (time.getDate() !== day || time.getHours() !== hh ||
                      time.getMinutes() !== mm || time.getSeconds() !== ss) continue;
                  if (time.getTime() <= now.getTime()) continue;
                  result.push(time);
                  if (result.length >= limit) return result;
                }
              }
            }
          }
          cursor.setDate(cursor.getDate() + 1);
        }
        return result;
      }

      return { parse: parse, next: next };
    })();
    /* CRON_PREVIEW_END */

    const PREVIEW_COUNT = 5;
    const WEEK_CN = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

    function pad2(n) {
      return n < 10 ? '0' + n : String(n);
    }

    function formatPreviewDate(date, now) {
      const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
      const dayDiff = Math.round((dayStart(date) - dayStart(now)) / 86400000);
      const time = pad2(date.getHours()) + ':' + pad2(date.getMinutes()) + ':' + pad2(date.getSeconds());
      const dateFull = date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate()) + ' ' + WEEK_CN[date.getDay()];
      let label;
      if (dayDiff === 0) label = '今天';
      else if (dayDiff === 1) label = '明天';
      else if (dayDiff === 2) label = '后天';
      else label = (date.getMonth() + 1) + '月' + date.getDate() + '日';
      const dateShort = (date.getFullYear() === now.getFullYear() ? '' : date.getFullYear() + '-') +
        pad2(date.getMonth() + 1) + '-' + pad2(date.getDate()) + ' ' + WEEK_CN[date.getDay()];
      return {
        label: label,
        time: time,
        date: dateShort,
        full: dateFull + ' ' + time
      };
    }

    function updateCronPreview(expression) {
      const listBox = document.getElementById('cronPreviewList');
      const tipBox = document.getElementById('cronPreviewTip');
      if (!listBox || !tipBox) return;

      const raw = String(expression == null ? '' : expression).trim();
      listBox.innerHTML = '';
      tipBox.className = 'cron-preview-tip';

      if (!raw) {
        tipBox.textContent = '填写完整的 Cron 表达式后，这里会显示接下来 5 次触发时间。';
        return;
      }

      let dates;
      try {
        dates = CronPreview.next(raw, PREVIEW_COUNT);
      } catch (e) {
        tipBox.className = 'cron-preview-tip err';
        tipBox.textContent = '表达式无法解析：' + (e && e.message ? e.message : '未知错误');
        return;
      }

      if (!dates.length) {
        tipBox.className = 'cron-preview-tip warn';
        tipBox.textContent = '未来 50 年内没有匹配的触发时间，请检查「日 / 月 / 周」的组合。';
        return;
      }

      const now = new Date();
      listBox.innerHTML = dates.map(function (date, index) {
        const info = formatPreviewDate(date, now);
        return '<span class="cron-preview-item" title="' + esc(info.full) + '">' +
          '<span class="cron-preview-index">' + (index + 1) + '</span>' +
          '<span class="cron-preview-when">' + esc(info.label) + ' <b>' + esc(info.time) + '</b></span>' +
          '<span class="cron-preview-date">' + esc(info.date) + '</span>' +
          '</span>';
      }).join('');

      if (dates.length < PREVIEW_COUNT) {
        tipBox.className = 'cron-preview-tip warn';
        tipBox.textContent = '未来 50 年内只找到 ' + dates.length + ' 次触发，该规则比较少见。';
      }
    }

    /* 判断表达式能否无损回填到图形化编辑器；不能时只保留文本框，避免被归一化成错误规则 */
    function canEditorRepresent(expression) {
      const text = String(expression == null ? '' : expression).trim().replace(/\s+/g, ' ');
      if (!text) return true;
      const parts = text.split(' ');
      if (parts.length === 5) parts.unshift('0');
      if (parts.length !== 6) return false;
      try {
        CronPreview.parse(text);
      } catch (e) {
        return false;
      }
      const generic = /^(\*|\*\/\d+|\d+-\d+|\d+(,\d+)*)$/;
      const dow = /^(\*|\d+(,\d+)*)$/;
      for (let i = 0; i < parts.length; i++) {
        if (i === 5 ? !dow.test(parts[i]) : !generic.test(parts[i])) return false;
      }
      return true;
    }

    function setEditorWarning(show) {
      const box = document.getElementById('cronEditorWarning');
      if (box) box.style.display = show ? 'block' : 'none';
      // 表达式无法无损回填时把图形编辑器整体收起，避免面板和文本框各说各话
      const editor = document.getElementById('cronSelector');
      if (editor) editor.style.display = show ? 'none' : '';
    }

    // 页面加载完成后初始化图形化 Cron 编辑器与触发时间预览
    document.addEventListener('DOMContentLoaded', function() {
      const container = document.getElementById('cronSelector');
      cronEditor = new CronEditor(container, {
        initial: '0 * * * * *',
        onChange: function() {
          // 编辑器变化时自动同步到文本输入框，并刷新触发预览
          const expr = this.getValue();
          document.getElementById('cronExpr').value = expr;
          setEditorWarning(false);
          updateCronPreview(expr);
        }
      });

      const cronInput = document.getElementById('cronExpr');
      let previewTimer = null;

      // 手动输入时先防抖刷新预览，不打断输入
      cronInput.addEventListener('input', function() {
        const value = this.value;
        if (previewTimer) clearTimeout(previewTimer);
        previewTimer = setTimeout(function() {
          updateCronPreview(value);
        }, 200);
      });

      // 失焦 / 回车时再同步回图形化编辑器
      cronInput.addEventListener('change', function() {
        if (previewTimer) { clearTimeout(previewTimer); previewTimer = null; }
        const value = this.value;
        const friendly = canEditorRepresent(value);
        setEditorWarning(!friendly && value.trim() !== '');
        if (cronEditor && friendly) {
          cronEditor.setValue(value);
        } else {
          updateCronPreview(value);
        }
      });

      updateCronPreview(cronInput.value || '0 * * * * *');

      // 页面长时间打开时定时刷新，避免相对时间（今天/明天）过期
      setInterval(function() {
        const input = document.getElementById('cronExpr');
        if (input) updateCronPreview(input.value);
      }, 30000);
    });

    /* HTML 转义，防止内容破坏结构 */
    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* 折叠状态下展示前 5 条提醒名称 */
    function renderListSummary(list) {
      const box = document.getElementById('listSummary');
      if (!box) return;
      if (!Array.isArray(list) || list.length === 0) {
        box.innerHTML = '<div class="summary-empty">暂无提醒配置</div>';
        return;
      }
      const top = list.slice(0, 5);
      const label = list.length > 5 ? '前 5 条' : '共 ' + list.length + ' 条';
      let html = '<span class="summary-label">' + label + '：</span>';
      top.forEach(function (item, index) {
        const name = esc(item.name);
        html += '<span class="summary-chip" title="' + name + '"><b>' + (index + 1) + '</b>' + name + '</span>';
      });
      if (list.length > 5) html += '<span class="summary-more">等 ' + list.length + ' 条</span>';
      box.innerHTML = html;
    }

    /* 展开指定卡片（进入编辑时确保表单可见） */
    function expandCard(id) {
      const card = document.getElementById(id);
      if (!card || !card.classList.contains('collapsed')) return;
      card.classList.remove('collapsed');
      const btn = card.querySelector('.collapse-btn');
      if (btn) {
        btn.setAttribute('aria-expanded', 'true');
        btn.firstChild.nodeValue = '收起';
      }
    }

    /* 列表中的「点击跳转」行：网址渲染成可点击链接，本地路径仅展示 */
    function buildJumpRow(raw) {
      const url = String(raw == null ? "" : raw).trim();
      if (!url) return "";
      const isWeb = /^https?:\/\//i.test(url);
      const body = isWeb
        ? `<a class="jump-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`
        : `<span class="jump-local">${esc(url)}</span>`;
      return `
        <div class="item-row">
          <span class="k">跳转</span>
          <span class="v">${body}</span>
        </div>`.trim();
    }

    async function loadList() {
      const container = document.getElementById('list');
      try {
        const res = await fetch('/api/reminders');
        const list = await res.json();
        renderListSummary(list);

        if (!Array.isArray(list) || list.length === 0) {
          container.innerHTML = '<div class="empty">暂无提醒配置，先在上方新增一条吧~</div>';
          return;
        }

        container.innerHTML = '';
        list.forEach(item => {
          const div = document.createElement('div');
          div.className = 'reminder-item';
          div.innerHTML = `
            <div class="item-head">
              <span class="item-name">${esc(item.name)}</span>
              <span class="badge ${item.enabled ? 'badge-on' : 'badge-off'}">${item.enabled ? '已启用' : '已禁用'}</span>
            </div>
            <div class="item-row">
              <span class="k">规则</span>
              <span class="v mono">${esc(item.cronExpr)}</span>
            </div>
            <div class="item-row">
              <span class="k">内容</span>
              <span class="v">${esc(item.content)}</span>
            </div>
            ${buildJumpRow(item.jumpUrl)}
            <div class="item-actions">
              <button class="btn btn-default btn-sm" data-act="edit" data-id="${esc(item.id)}">编辑</button>
              <button class="btn btn-danger btn-sm" data-act="del" data-id="${esc(item.id)}">删除</button>
            </div>
          `;
          container.appendChild(div);
        });
      } catch (e) {
        container.innerHTML = '<div class="empty">列表加载失败，请检查服务是否正常</div>';
        const summaryBox = document.getElementById('listSummary');
        if (summaryBox) summaryBox.innerHTML = '<div class="summary-empty">列表加载失败</div>';
      }
    }

    /* 列表按钮事件委托 */
    document.getElementById('list').addEventListener('click', function (e) {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const id = btn.dataset.id;
      if (btn.dataset.act === 'edit') editReminder(id);
      else delReminder(id);
    });

    // 进入编辑模式，回填数据
    async function editReminder(id) {
      const res = await fetch('/api/reminders');
      const list = await res.json();
      const target = list.find(item => String(item.id) === String(id));
      if (!target) return;

      currentEditId = target.id;
      expandCard('formCard');

      const title = document.getElementById('formTitle');
      title.classList.add('is-edit');
      title.firstChild.nodeValue = '编辑提醒';

      document.getElementById('name').value = target.name;
      document.getElementById('cronExpr').value = target.cronExpr;
      updateCronPreview(target.cronExpr);
      document.getElementById('content').value = target.content;
      document.getElementById('jumpUrl').value = target.jumpUrl || "";
      document.getElementById('enabled').checked = !!target.enabled;
      document.getElementById('cancelEditBtn').style.display = 'inline-block';

      // 同步回填到图形化编辑器；高级写法只保留在文本框里，避免被错误归一化
      if (cronEditor && canEditorRepresent(target.cronExpr)) {
        setEditorWarning(false);
        setTimeout(() => {
          if (cronEditor) cronEditor.setValue(target.cronExpr);
        }, 50);
      } else {
        setEditorWarning(true);
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 取消编辑，重置表单
    function cancelEdit() {
      currentEditId = null;

      const title = document.getElementById('formTitle');
      title.classList.remove('is-edit');
      title.firstChild.nodeValue = '新增提醒';

      document.getElementById('name').value = '';
      document.getElementById('cronExpr').value = '';
      document.getElementById('content').value = '';
      document.getElementById('jumpUrl').value = '';
      document.getElementById('enabled').checked = true;
      document.getElementById('cancelEditBtn').style.display = 'none';
      setEditorWarning(false);

      // 清空图形化编辑器
      setTimeout(() => {
        if (cronEditor) {
          cronEditor.setValue('0 * * * * *');
        }
      }, 50);
    }

    /* 判断跳转目标格式是否规范：网址 / file:// / 盘符路径 / UNC 路径 / 绝对路径 */
    function isValidJumpTarget(v) {
      return /^(https?:\/\/|file:\/\/)/i.test(v) ||
        /^[a-zA-Z]:[\\/]/.test(v) ||
        /^\\\\/.test(v) ||
        /^\//.test(v);
    }

    async function saveReminder() {
      const data = {
        name: document.getElementById('name').value.trim(),
        cronExpr: document.getElementById('cronExpr').value.trim(),
        content: document.getElementById('content').value.trim(),
        jumpUrl: document.getElementById('jumpUrl').value.trim(),
        enabled: document.getElementById('enabled').checked
      };

      if (!data.name) { alert('请填写提醒名称'); return; }
      if (!data.cronExpr) { alert('请填写 Cron 表达式'); return; }
      try {
        CronPreview.parse(data.cronExpr);
      } catch (e) {
        alert('Cron 表达式不合法：' + e.message);
        return;
      }
      // 跳转地址轻校验：支持 http(s):// 、file:// 、盘符路径、UNC 路径，其余值提示确认
      if (data.jumpUrl && !isValidJumpTarget(data.jumpUrl)) {
        if (!confirm('跳转地址既不是 http/https 网址，也不是完整的本地路径，可能无法打开。仍要保存吗？')) return;
      }

      // 如果是编辑模式，带上 id 字段
      if (currentEditId !== null) data.id = currentEditId;

      await fetch('/api/reminders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      cancelEdit();
      loadList();
      alert('保存成功');
    }

    async function delReminder(id) {
      if (!confirm('确定要删除这条提醒吗？')) return;

      await fetch(`/api/reminders/${id}`, { method: 'DELETE' });

      // 如果删除的是当前正在编辑的条目，自动退出编辑模式
      if (currentEditId !== null && String(currentEditId) === String(id)) cancelEdit();
      loadList();
    }

    // 卡片折叠 / 展开（标题或按钮点击均可）
function toggleCard(card) {
  if (!card) return;
  const collapsed = card.classList.toggle('collapsed');
  const btn = card.querySelector('.collapse-btn');
  if (btn) {
    btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    btn.firstChild.nodeValue = collapsed ? '展开' : '收起';
  }
}

document.querySelectorAll('.card-title').forEach(function (title) {
  title.style.cursor = 'pointer'; // 可选：鼠标手势提示可点击
  title.addEventListener('click', function (e) {
    // 点在按钮上时交给按钮自己处理，避免 toggle 两次
    if (e.target.closest('button')) return;
    const card = title.closest('.card');
    toggleCard(card);
  });
});

document.querySelectorAll('.collapse-btn').forEach(function (btn) {
  btn.addEventListener('click', function (e) {
    e.stopPropagation(); // 阻止冒泡到标题，避免重复
    toggleCard(document.getElementById(btn.dataset.card));
  });
});

    loadList();
  </script>
</body>
</html>
